name: Support a new tool
description: Ask for a new coding tool (Gemini, Cursor, ...)
labels: [new-tool]
body:
  - type: input
    id: tool
    attributes:
      label: Tool name
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where does the tool keep its usage data?
      description: A path and the file format (JSONL, SQLite, ...). Do not paste real data. A few synthetic lines of the same shape help a lot.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can write the parser (see CONTRIBUTING.md, "Add a new tool")
