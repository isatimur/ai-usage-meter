name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The core and the CLI use only cross-platform crates, so they must build and pass on Linux too.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install xcodegen
      - name: Build the app and pack the DMG (ad-hoc signed)
        run: scripts/package.sh
      - name: Swift unit tests
        run: |
          cd app
          xcodebuild -project AIUsageMeter.xcodeproj -scheme AIUsageMeter -derivedDataPath ../target/xcode \
            -destination "platform=macOS" CODE_SIGN_IDENTITY="-" test
      - name: Swift unit tests (Intel slice, under Rosetta)
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          cd app
          xcodebuild -project AIUsageMeter.xcodeproj -scheme AIUsageMeter -derivedDataPath ../target/xcode \
            -destination "platform=macOS,arch=x86_64" CODE_SIGN_IDENTITY="-" test
      - name: Check the DMG and the universal binary
        run: |
          hdiutil verify dist/AIUsageMeter-*.dmg
          lipo -archs target/xcode/Build/Products/Release/AIUsageMeter.app/Contents/MacOS/AIUsageMeter | tee /dev/stderr | grep -q x86_64
          lipo -archs target/xcode/Build/Products/Release/AIUsageMeter.app/Contents/MacOS/AIUsageMeter | grep -q arm64
