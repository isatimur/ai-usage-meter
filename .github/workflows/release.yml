name: release

# Push a tag such as v0.1.0 to build, sign, notarize and publish a DMG.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate with key, as a .p12, base64-encoded
#   MACOS_CERT_PASSWORD     password of that .p12
#   MACOS_SIGN_IDENTITY     for example: Developer ID Application: Your Name (TEAMID)
#   NOTARY_APPLE_ID         Apple ID used for notarization
#   NOTARY_TEAM_ID          Apple team id
#   NOTARY_PASSWORD         app-specific password for that Apple ID
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No third-party action here: this job holds the signing certificate and Apple credentials.
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install xcodegen
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store notary credentials
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: xcrun notarytool store-credentials ci-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD"
      - name: Build, sign, notarize
        env:
          AIUM_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AIUM_NOTARY_PROFILE: ci-notary
          AIUM_VERSION: ${{ github.ref_name }}
        run: scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.dmg dist/*.dmg.sha256 --title "$TAG" --generate-notes
