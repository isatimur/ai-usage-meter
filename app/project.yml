name: AIUsageMeter
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
targets:
  AIUsageMeter:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: AI Usage Meter
        CFBundleDisplayName: AI Usage Meter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: "AI Usage Meter selects the Terminal tab that runs a session you click."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aiusagemeter.AIUsageMeter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../crates/core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/universal
        CODE_SIGN_ENTITLEMENTS: AIUsageMeter.entitlements
        OTHER_LDFLAGS: "-laium_core -lresolv"
  AIUsageMeterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: AIUsageMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aiusagemeter.AIUsageMeterTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AIUsageMeter.app/Contents/MacOS/AIUsageMeter
        BUNDLE_LOADER: $(TEST_HOST)
        HEADER_SEARCH_PATHS: $(SRCROOT)/../crates/core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/universal
schemes:
  AIUsageMeter:
    build:
      targets:
        AIUsageMeter: all
    test:
      targets:
        - AIUsageMeterTests
